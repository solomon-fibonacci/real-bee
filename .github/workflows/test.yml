name: Full Test Suite

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: realbee_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 -U test && break
            echo "Still waiting..."
            sleep 1
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            redis-cli -h localhost -p 6380 ping && break
            echo "Still waiting..."
            sleep 1
          done

          echo "Services are ready!"

      - name: Run linting
        run: |
          pip install ruff black
          ruff check src/ || true
          black --check src/ || true

      - name: Run unit tests
        run: |
          pytest tests/unit -v -x \
            --cov=realbee \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          POSTGRES_URL: postgresql://test:test@localhost:5433/realbee_test
          REDIS_URL: redis://localhost:6380/0

      - name: Run integration tests
        run: |
          pytest tests/integration -v -x \
            --cov=realbee \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          POSTGRES_URL: postgresql://test:test@localhost:5433/realbee_test
          REDIS_URL: redis://localhost:6380/0

      - name: Run E2E tests
        run: |
          pytest tests/e2e -v -x \
            --cov=realbee \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          POSTGRES_URL: postgresql://test:test@localhost:5433/realbee_test
          REDIS_URL: redis://localhost:6380/0

      - name: Generate coverage report
        run: |
          pip install coverage
          coverage report -m
          coverage html

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v3
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install ruff black mypy

      - name: Run ruff
        run: ruff check src/

      - name: Run black
        run: black --check src/

      - name: Run mypy (type checking)
        run: mypy src/ --ignore-missing-imports || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run bandit
        run: bandit -r src/ -ll

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --json || true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Test job status: ${{ needs.test.result }}"
          echo "Lint job status: ${{ needs.lint.result }}"
          echo "Security job status: ${{ needs.security.result }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "⚠️  Linting issues found"
          fi

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "⚠️  Security issues found"
          fi

          echo "✅ All checks completed"
