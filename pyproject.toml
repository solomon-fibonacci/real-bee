[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-bee"
version = "0.1.0"
description = "REAL-time Back-End on Events - A high-performance framework for CRUD and real-time event-driven systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "real-bee contributors"}
]
keywords = ["fastapi", "crud", "realtime", "websocket", "events", "multimodal", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
search = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "Pillow>=10.0.0",
    "faiss-cpu>=1.7.4",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "faker>=20.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
    "coverage>=7.3.0",
]
all = [
    "real-bee[search,dev]",
]

[project.urls]
Homepage = "https://github.com/solomon-fibonacci/real-bee"
Documentation = "https://github.com/solomon-fibonacci/real-bee"
Repository = "https://github.com/solomon-fibonacci/real-bee"
Issues = "https://github.com/solomon-fibonacci/real-bee/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realbee = ["py.typed"]
